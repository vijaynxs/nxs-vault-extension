name: Build NXS Vault Android app

on:
  workflow_dispatch:
    inputs:
      bitwarden_tag:
        description: "Bitwarden Android Password Manager release to build"
        required: true
        default: "v2026.9.0-bwpm"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout our branding repo
        uses: actions/checkout@v4

      - name: Download Bitwarden Android source (pinned version)
        run: git clone --depth 1 --branch "${{ inputs.bitwarden_tag }}" https://github.com/bitwarden/android.git bw

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Save original source snapshot
        run: |
          tar --exclude=.git -czf nxs-vault-android-source.tar.gz bw
          ls -lh nxs-vault-android-source.tar.gz

      - name: Apply NXS Vault branding
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f scripts/brand_android.py ]; then
            python3 scripts/brand_android.py bw
          else
            echo "No Android branding script yet - plain build"
          fi

      - name: Build F-Droid flavour release APK (no Google services)
        working-directory: bw
        run: ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          find bw/app/build/outputs -name "*.apk" -exec ls -l {} \;
          APK=$(find bw/app/build/outputs/apk -path "*fdroid*" -path "*release*" -name "*.apk" | head -1)
          echo "Using $APK"
          cp "$APK" nxs-vault-android-unsigned.apk
          ls -lh nxs-vault-android-unsigned.apk

      - name: Publish release (not marked latest, so Chrome updates are unaffected)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ inputs.bitwarden_tag }}-build${{ github.run_number }}"
          gh release create "$TAG" nxs-vault-android-unsigned.apk nxs-vault-android-source.tar.gz \
            --latest=false \
            --title "NXS Vault Android ${{ inputs.bitwarden_tag }} (build ${{ github.run_number }})" \
            --notes "Built from Bitwarden Android ${{ inputs.bitwarden_tag }} (F-Droid flavour, no Google services). Unsigned: the vault server signs it with the NXS key before publishing."
